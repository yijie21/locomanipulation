# Select the commit hook OR make check for final validation, not both.
# Checks do not rewrite files; run make format to fix formatting before retrying.
repos:
  - repo: local
    hooks:
      - id: check-changes
        name: final validation (documentation or full CPU checks)
        entry: python3 scripts/check_changes.py
        language: system
        pass_filenames: false
        always_run: true
