# Tooling only (the package is not pip-installed; see docs/reference/standards.md).
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party", "src/gr00t", "configs/gr00t_bfm_*.py", "outputs", ".claude", "patches", "legacy"]

[tool.ruff.lint]
# Deliberately small: errors, pyflakes, import order, a few bug-prone patterns.
# Style beyond formatting is not linted; the formatter owns layout.
select = ["E4", "E7", "E9", "F", "I", "B006", "B008", "B015", "B018"]
# F401/F841 (unused import/variable) are reported, not enforced, until step 2 deletes the
# retired branches that own most of them; re-enable then.
ignore = ["E731", "E741", "F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# tests insert src into sys.path before importing locomani
"tests/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
# environment must be configured before the Isaac / MuJoCo imports
"src/locomani/sim/isaac/*.py" = ["E402"]
"src/locomani/sim/make_hand_points.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["locomani", "real_robot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "sim: needs a live sim/deploy stack (run with --run-sim on a GPU box)",
  "torch: needs torch + the GR00T venv (run with --run-torch)",
]
addopts = "-q"
