# Box pilot, slow walk-in: walk_speed_min 0.20 so the last ~0.3 m runs at 0.20-0.24 (speed map of 2026-09-22, ledger crate.md). Otherwise identical to box_pilot_env_20260922: carry limits + measured anchor + feedback 1.0/0.15 from crate_env2_so50.
