# which GR00T contract the dataset, the finetune and the policy server share
embodiment:
  name: g1_single_arm
  gr00t_tag: unitree_g1_sonic
  gr00t_modality_config: configs/gr00t_sonic_2cam.py

# the frozen scene directory, copied into the run directory before the first batch
scene:
  dir: outputs/scene/sim_lowcom
  cases: null

# the collection stack. no_encoder is false: without the encoder the deploy silently drops the
# planner's arm and crouch references, which is what a scripted expert steers with
images:  # which renderer draws the policy's pictures, in the dataset and the closed loop alike: mujoco | isaac (isaac needs backend.render offline, the scene's Isaac stage and a second card; docs/warehouse_design.md §4)
  source: mujoco
backend:
  no_encoder: false
  hand: dex1
  upper_slew_deg: 2.0
  grip_delay: 0
  obs_dump: null
  replace: false
  wrist_cams: true
  sim_vis: none
  scene_random: false
  dataset_fps: 30.0
  clean_deploy: false
  eval_parallel: false
  sonic_dds_domain: null
  lockstep:
    enabled: false
    ack_timeout: 5.0
    warmup_ticks: 60
    cmd_delay: 0
    jitter: false
    jitter_seed: 0
    no_seed: false

# How much to collect, and in what batches (one stack lifetime per batch).
# These two blocks are plain YAML rather than dataclasses, so they are NOT in
# docs/reference/config_fields.md -- this is where they are documented.
collect:
  successes: 40       # episodes to keep. WITHOUT scene.cases, collection stops as soon as it
                      # has this many; WITH a fixed bank it is only the acceptance floor and the
                      # whole batch_rounds budget always runs (see docs/running.md, "采集什么时候停")
  batch_rounds: 10    # attempts per batch. With a fixed bank this is what decides how many rounds run
  max_batches: 4      # batch ceiling, so a bad run ends instead of collecting forever
  seed0: 40000        # first batch's sampling seed; batch k uses seed0 + 100*k
  instance: 3         # port block for the stack. Only instance 0 runs the exporter, so recording needs 0
  record: false       # false samples and scores rounds without writing episodes (cheap dry pilots)
  gym_env: []         # extra KEY=VALUE for the expert process, recorded in commands.jsonl
  stack_env: []       # extra KEY=VALUE for sim/deploy/exporter

# The finetune; the recipe itself lives in scripts/train_bottle.sh.
train:
  steps: 10000        # optimiser steps
  save_steps: 5000    # checkpoint interval. The run's artifact is model/checkpoint-<steps>, so
                      # steps must be a multiple of this or the last step saves nowhere
  holdout: 10         # episodes held out for checkpoint selection. Consumed by CONVERT, not train,
                      # and it must be < collect.successes or conversion refuses. 0 trains on everything
  gpus: 1             # >1 switches the recipe to DeepSpeed ZeRO-2
  global_batch: 64    # batch size summed across gpus
  squat_max: 4096     # squat-token clamp passed through to the recipe
  base_model: null    # null starts from GR00T-N1.7-3B; a path resumes from your own checkpoint

# the closed loop. This whole block is handed to the evaluator as one file -- hand-copying
# fields is what made a 100-round run spawn at 0.7 m while this said 1.1-1.3 m (2026-09-17)
eval:
  backend:
    no_encoder: true
    hand: dex1
    upper_slew_deg: 2.0
    grip_delay: 0
    obs_dump: null
    replace: false
    wrist_cams: true
    sim_vis: none
    scene_random: false
    dataset_fps: 25.0
    clean_deploy: false
    eval_parallel: false
    sonic_dds_domain: null
    lockstep:
      enabled: true
      ack_timeout: 5.0
      warmup_ticks: 60
      cmd_delay: 0
      jitter: false
      jitter_seed: 0
      no_seed: false
  budget_s: 90.0
  ensemble_n: 1
  ensemble_m: 0.3
  rtc: false
  transition_commit: false
  transition_decoder: null
  grip_gain: 1.0
  snap: true
  stall_abort_s: 0.0
  rounds: 100
  seed: 6000
  client: lockstep  # every VLA evaluation runs lockstep since 2026-09-28: the world waits for rendering and inference
  replan_interval: 0.4
  execution_horizon: 16
  policy_port: 5710  # outside every instance's port block (5555-5622 for instances 0-4); 5590 is instance 1's keyboard port
  stand_retries: 0
  latency_dist: null
  latency_frames: 2  # the calibrated target model: 2 frames of inference, the old chunk continued meanwhile
  camera_frames: 0
  gap: continue
  restart_deploy: true
  resume: false
  force_resume: false
  spawn_edge:
  - 1.1
  - 1.3
  task: pick up the water bottle
  target: water_bottle
  video_include_init: true  # film from the teleport: a [stand] failure ends the round before the
  # visibility gate, and that is the family with no footage at all otherwise
  initial_token: configs/deployment/whole_body_initial_token.json
