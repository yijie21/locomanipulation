# Option (b) of the route plan (user, 2026-10-09): the CuRobo route takes the right hand only to its lifted-ready pose, waist near upright
# (ROUTE_WAIST_LIMITS), held ready_hold_s, then the grasp loop's own 2.5 s slide to the pre-grasp. Same seeds as A / A'.
# B: instance 3.
# docs/handoff/single-arm-curobo-route-plan-20261009.md section 3: bottle_simple_200 (the main line: guard walk +
# lifted ready) at 40 rounds -- four batches of ten, seeds 40000-40009, 40100-40109, 40200-40209, 40300-40309 --
# without recording (the A/B compares outcomes and the state traces, not episodes).
# B: arm_route curobo -- one CuRobo route for the waist + right arm from the hang to the pre-grasp, the left
# hand hanging; needs the route service on TF_CUROBO_PORT (primitives/curobo_service.py).
#
# Single-arm bottle: the simple expert on its low-CoM scene -- 200 kept
# episodes with randomised spawns, a 10k-step finetune, 100 closed-loop rounds. The collection
# seeds (40000 + 100*batch) stay clear of the frozen gate bank (30700) and the reserved fresh20
# bank (30900), so neither is ever trained on.
# Since 2026-09-25 the expert walks in the warehouse way (task.reach.simple.approach_stop guard; pilot
# bottle_simple_guard_lifted_20260925 10/10 on this file's first ten seeds).
#
# This file is complete: every value a run reads is here, with no inheritance and no composition.
# A new experiment is a copy with a few lines changed. The run copies it verbatim to
# outputs/runs/<name>/config.yaml, and that copy is the provenance of the run.
#
# Only fields something reads are listed. The 2026-09-17 audit dropped embodiment.{arms, state_dim,
# action_dim, cameras, dataset_kind} and scene.{name, preset}: nothing in the repository read them,
# and "declared but never read" is the shape this refactor exists to remove. The state/action
# dimensions and the camera set are defined by the file embodiment.gr00t_modality_config points at,
# and check_dataset holds the dataset to it.
name: bottle_route_curobo_ready_20261009

