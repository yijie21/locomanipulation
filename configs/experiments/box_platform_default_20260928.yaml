# The bimanual box grasp DEFAULT since 2026-09-28 (user decision): box_platform_default_20260927 with the compact
# post-brake arm preparation (visual.ready_after_brake compact: the planner arm takes the walking arms over at once,
# no 0.3 s landing sleep, 1.5 s blend, no hold, re-anchor + 0.3 s). Measured in the room, four edges, 45x32x33:
# compact 17/40 vs quick 19/40 (paired McNemar p = 0.83), brake-to-reach 8.7 -> 4.9 s, a round 28.8 -> 24.9 s
# (docs/ledger/crate.md 2026-09-28). Everything else, and why: box_platform_default_20260927 and docs/box_grasp_envelope.md.
