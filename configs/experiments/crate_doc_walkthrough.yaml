# Bimanual crate on a 30 cm table: the camera-guided expert walks in, grips the rim with both
# hands, lifts and stands up, recording LeRobot episodes. task.expert picks which expert runs --
# visual is the recording line, wall and carry are diagnostics.
#
# This file is complete: every value a run reads is here, with no inheritance and no composition.
# A new experiment is a copy with a few lines changed. The run copies it verbatim to
# outputs/runs/<name>/config.yaml, and that copy is the provenance of the run.
#
# Only fields something reads are listed. The 2026-09-17 audit dropped embodiment.{arms, state_dim,
# action_dim, cameras, dataset_kind} and scene.{name, preset}: nothing in the repository read them,
# and "declared but never read" is the shape this refactor exists to remove. The state/action
# dimensions and the camera set are defined by the file embodiment.gr00t_modality_config points at,
# and check_dataset holds the dataset to it.
name: crate_doc_walkthrough

# the expert's decisions, acceptance gates and failure families; written to task_config.json for the expert process
task:
  plugin: crate
  expert: visual
  carry:
    reach_control: whole_body
    waist_dofs: all
    settle_seconds: 0.3
    joint_speed: 0.7
    joint_acceleration: 2.0
    waist_pitch_max: 0.52
    pelvis_height: null
    height_speed: 0.04
    pelvis_pitch_max: 0.7
    pelvis_height_min: 0.65
  visual:
    pose_source: assisted
    waist_pitch_max: 0.4
    palm_pitch_deg: 60.0
    start_edge_min: 1.2
    start_edge_max: 1.5
    walk_speed: 0.35
    walk_speed_min: 0.35
    walk_brake_margin: 0.1
    walk_timeout: 30.0
    settle_seconds: 0.3
    stand_lateral_tolerance: 0.14
    stand_depth_tolerance: 0.04
    stand_depth_retries: 2
    lift_seconds: 4.0
    stand_seconds: 5.0
    upright_tolerance_deg: 12.0
    stand_off: 0.39
    position_jitter: 0.02
    yaw_jitter_deg: 5.0
    pregrasp_above: 0.04
    approach_speed: 0.16
    joint_speed: 0.7
    joint_acceleration: 2.0
    palm_rotation_speed: 0.6
    palm_align_tolerance_deg: 10.0
    tracking_gain: 0.7
    tracking_cap: 0.04
    align_tolerance: 0.018
    close_seconds: 0.8
    probe_height: 0.025
    lift_height: 0.1
    hold_seconds: 2.0
    hold_position_tolerance: 0.025
    timeout_seconds: 35.0
    vision_timeout: 0.7
    reprojection_px: 4.0
    max_tilt_deg: 15.0
  wall_feature: rail
  wall_walk: false
  gripper_gear: 250.0
  couple_fingers: true
  crate_setback: 0.0
  crate_setback_levels_m: []
  crate_yaw_levels_deg: []
  crate_dy_range_m:
  - -0.08
  - 0.08
  scene_preset: crate_bimanual
  prompt: pick up the crate
  deploy_self_heal_rounds: 2

# which GR00T contract the dataset, the finetune and the policy server share
embodiment:
  name: g1_bimanual
  gr00t_tag: unitree_g1_sonic
  gr00t_modality_config: configs/gr00t_sonic_3cam_bimanual.py

# the frozen scene directory, copied into the run directory before the first batch
scene:
  dir: outputs/scene/crate_table30_depth04
  cases: null

# the collection stack. no_encoder is false: without the encoder the deploy silently drops the
# planner's arm and crouch references, which is what a scripted expert steers with
backend:
  no_encoder: false
  hand: dex1
  upper_slew_deg: 2.0
  grip_delay: 0
  obs_dump: null
  replace: false
  wrist_cams: true
  sim_vis: none
  scene_random: false
  dataset_fps: 30.0
  clean_deploy: false
  eval_parallel: false
  sonic_dds_domain: null
  lockstep:
    enabled: false
    ack_timeout: 5.0
    warmup_ticks: 60
    cmd_delay: 0
    jitter: false
    jitter_seed: 0
    no_seed: false

# how much to collect, and in what batches (one stack lifetime per batch)
collect:
  successes: 1
  batch_rounds: 1
  max_batches: 1
  seed0: 7000
  instance: 2
  record: true
  gym_env: []
  stack_env: []

# the finetune; the recipe itself lives in scripts/train_bottle.sh
train:
  steps: 10
  save_steps: 10
  holdout: 0
  gpus: 1
  global_batch: 64
  squat_max: 4096
  base_model: null

# the closed loop. This whole block is handed to the evaluator as one file -- hand-copying
# fields is what made a 100-round run spawn at 0.7 m while this said 1.1-1.3 m (2026-09-17)
eval:
  backend:
    no_encoder: true
    hand: dex1
    upper_slew_deg: 2.0
    grip_delay: 0
    obs_dump: null
    replace: false
    wrist_cams: true
    sim_vis: none
    scene_random: false
    dataset_fps: 25.0
    clean_deploy: false
    eval_parallel: false
    sonic_dds_domain: null
    lockstep:
      enabled: false
      ack_timeout: 5.0
      warmup_ticks: 60
      cmd_delay: 0
      jitter: false
      jitter_seed: 0
      no_seed: false
  budget_s: 90.0
  ensemble_n: 1
  ensemble_m: 0.3
  rtc: false
  transition_commit: false
  transition_decoder: null
  grip_gain: 1.0
  snap: true
  stall_abort_s: 0.0
  rounds: 1
  seed: 6000
  client: blocking  # the crate evaluator implements only this; it refuses any other value
  replan_interval: 0.4
  execution_horizon: 16
  policy_port: 5700
  stand_retries: 1
  latency_dist: null
  latency_frames: null
  camera_frames: 0
  gap: continue
  restart_deploy: true
  resume: false
  force_resume: false
  spawn_edge:
  - 1.2
  - 1.5
  task: pick up the crate
  target: crate
  video_include_init: true
  initial_token: configs/deployment/crate_initial_token.json
