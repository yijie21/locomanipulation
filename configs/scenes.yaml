    rtx_settings: [/rtx/post/histogram/enabled=false, /rtx/post/tonemap/filmIso=80, /rtx/indirectDiffuse/scalingFactor=2.0, /rtx/post/tonemap/op=4]
    supersample: 2
  unreal:  # the room level with this scene's robot and carton imported; look: the room's volume, 8 captures a request
    level: warehouse_box_45x20x33  # /Game/Levels/warehouse_box_45x20x33 in the host project ($UE_PROJECT)
    repeats: 8
    build: $BRIDGE_PY -m locomani.sim.unreal.build_level warehouse_box_45x20x33

warehouse_box_45x32x18:
  dir: outputs/scene/warehouse_box_45x32x18
  example: configs/experiments/warehouse_edges_compact_45x32x18_20260928.yaml
  build: third_party/GR00T-WholeBodyControl/.venv_sim/bin/python -m locomani.tasks.crate.warehouse_box_scene outputs/scene/warehouse_box_45x32x18 --width 0.45 --length 0.32 --height 0.18
  isaac:  # the room stage with this carton's mesh scale; source.json pins the MJCF. Look: as warehouse_box_45x32x33
