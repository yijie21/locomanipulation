  dir: outputs/scene/warehouse_box_45x20x18
  example: configs/experiments/warehouse_edges_compact_45x20x18_20260928.yaml
  build: third_party/GR00T-WholeBodyControl/.venv_sim/bin/python -m locomani.tasks.crate.warehouse_box_scene outputs/scene/warehouse_box_45x20x18 --width 0.45 --length 0.20 --height 0.18
  isaac:  # the room stage with this carton's mesh scale; source.json pins the MJCF. Look: as warehouse_box_45x32x33
    dir: warehouse_box_45x20x18_env
