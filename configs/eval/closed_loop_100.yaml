# eval/closed_loop_100: generated from configs/eval/closed_loop_100.json on 2026-09-16
defaults:
- _schema
- _self_
backend:
  no_encoder: true
  hand: dex1
  upper_slew_deg: 2.0
  grip_delay: 0
  obs_dump: null
  replace: false
  wrist_cams: true
  sim_vis: none  # the round video comes from SIM_VIDEO_DIR, not from this; 'full' costs sim speed
  # (image publish 33 -> 19 Hz on 2026-09-17) and the robot then collapses at the reset teleport
  scene_random: false
  dataset_fps: 25.0
  clean_deploy: false
  eval_parallel: false
  sonic_dds_domain: null
  lockstep:
    enabled: false
    ack_timeout: 5.0
    warmup_ticks: 60
    cmd_delay: 0
    jitter: false
    jitter_seed: 0
    no_seed: false
rounds: 100
seed: 6000
client: async
budget_s: 90.0
replan_interval: 0.4
execution_horizon: 16
ensemble_n: 1
ensemble_m: 0.3
rtc: false
transition_commit: false
transition_decoder: null
policy_port: 5590
stand_retries: 1
latency_dist: null
latency_frames: null
grip_gain: 1.0
snap: true
stall_abort_s: 0.0
resume: false
force_resume: false
spawn_edge:
- 1.1
- 1.3
task: pick up the water bottle
target: water_bottle
# the bottle lines collect from SONIC's own arms-down reference, so the prelude must hold that token
initial_token: configs/deployment/whole_body_initial_token.json
video_include_init: true  # film from the teleport: a [stand] failure ends the round before the
# visibility gate, and that is the family with no footage at all otherwise
