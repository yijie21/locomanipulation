# bench/simple: the switches SIMPLE runs with unless a run overrides them (ported from bench-options, its TODO 49.1; selfwm TODO 38.11).
# The default combination (user, 2026-11-24): SIMPLE, ScaleBFM, one RGB-D camera -- perception column, the replica's MuJoCo
# head camera (cloud_blind, look_dump_blind), leg odometry for the belief and for the pelvis ScaleBFM is told. The numbers
# recorded from 2026-11-20 to 11-24 (selfmodel_bench_20261123, selfmodel_jref_20261124) are on the stereo look: sensor=stereo.
defaults:
- _schema
- _self_
bench: simple
target: perception
sensor: rgbd
depth_noise: none
self_pose: odometry
controller_root: odometry
controller: scalebfm
