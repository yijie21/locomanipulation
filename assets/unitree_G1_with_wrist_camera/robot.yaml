  D435_HEAD_SERIAL: "243322074751"
  D435_HEAD_NAME: d435_head

  D455_HEAD_SERIAL: "338122303144"
  D455_HEAD_NAME: d455_head

  D405_WRIST_LEFT_SERIAL: "230322271135"
  D405_WRIST_LEFT_NAME: d405_left_wrist

  D405_WRIST_RIGHT_SERIAL: "335122270916"
  D405_WRIST_RIGHT_NAME: d405_right_wrist