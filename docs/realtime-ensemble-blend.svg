<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 340" role="img"
     aria-label="三个chunk A、B、C分别从t=0.0秒、0.4秒、0.8秒开始，各覆盖1.33秒。在t=0.9秒这一刻画一条竖线，同时穿过三个chunk：A此刻对应第27帧，B对应第15帧，C对应第3帧。三者按新旧加权平均，C(最新)权重44%，B权重32%，A权重24%，合并为一个输出动作。">
  <defs>
    <style>
      text{ font-family: -apple-system, "Segoe UI", sans-serif; fill:#172420; }
      .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <pattern id="ticks3" width="16" height="22" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#C2CCC3" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1140" height="340" fill="#FBFCFB"/>

  <!-- chunk A -->
  <text x="60" y="50" class="mono" font-size="11" fill="#4E5B55">chunk A · t0 = 0.0s</text>
  <rect x="60" y="58" width="638" height="22" fill="url(#ticks3)" stroke="#C2CCC3"/>
  <!-- chunk B -->
  <text x="252" y="102" class="mono" font-size="11" fill="#4E5B55">chunk B · t0 = 0.4s</text>
  <rect x="252" y="110" width="638" height="22" fill="url(#ticks3)" stroke="#C2CCC3"/>
  <!-- chunk C -->
  <text x="444" y="154" class="mono" font-size="11" fill="#4E5B55">chunk C · t0 = 0.8s</text>
  <rect x="444" y="162" width="638" height="22" fill="url(#ticks3)" stroke="#C2CCC3"/>

  <!-- NOW line at t=0.9s -->
  <line x1="492" y1="34" x2="492" y2="200" stroke="#C1571F" stroke-width="2"/>
  <polygon points="492,34 485,24 499,24" fill="#C1571F"/>
  <text x="498" y="30" class="mono" font-size="11" fill="#7A3510">此刻 t = 0.9s</text>

  <circle cx="492" cy="69" r="4" fill="#C1571F"/>
  <text x="502" y="73" class="mono" font-size="10.5" fill="#172420">idx 27</text>
  <circle cx="492" cy="121" r="4" fill="#C1571F"/>
  <text x="502" y="125" class="mono" font-size="10.5" fill="#172420">idx 15</text>
  <circle cx="492" cy="173" r="4" fill="#C1571F"/>
  <text x="502" y="177" class="mono" font-size="10.5" fill="#172420">idx 3</text>

  <!-- weight bars -->
  <text x="60" y="222" class="mono" font-size="10.5" letter-spacing="0.06em" fill="#7C8880">按年龄加权(M=0.3, age 0=最新)</text>
  <text x="60" y="248" class="mono" font-size="11" fill="#172420">C</text>
  <rect x="80" y="238" width="264" height="14" rx="3" fill="#C1571F"/>
  <text x="350" y="249" class="mono" font-size="10.5" fill="#4E5B55">44%</text>
  <text x="60" y="270" class="mono" font-size="11" fill="#172420">B</text>
  <rect x="80" y="260" width="194" height="14" rx="3" fill="#C1571F" opacity="0.75"/>
  <text x="280" y="271" class="mono" font-size="10.5" fill="#4E5B55">32%</text>
  <text x="60" y="292" class="mono" font-size="11" fill="#172420">A</text>
  <rect x="80" y="282" width="144" height="14" rx="3" fill="#C1571F" opacity="0.5"/>
  <text x="230" y="293" class="mono" font-size="10.5" fill="#4E5B55">24%</text>

  <line x1="80" y1="312" x2="700" y2="312" stroke="#C2CCC3" stroke-width="1"/>
  <polygon points="700,312 690,307 690,317" fill="#7C8880"/>
  <text x="710" y="316" font-size="11.5" fill="#172420">→ 三份预测按 44/32/24% 混合成这一帧真正发出去的动作</text>
</svg>
