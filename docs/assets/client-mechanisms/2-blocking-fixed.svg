<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" width="820" height="210"><style>
text{font-family:'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:12.5px;fill:#22262b}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11.5px}
.mut{fill:#6b7280}
.axis{stroke:#d8d5cc;stroke-width:1}
</style><rect x="0" y="0" width="820" height="210" fill="#ffffff"/>
  <line x1="30" y1="150" x2="800" y2="150" class="axis"/>
  <text x="30" y="30" font-weight="600">递给身体的指令</text>
  <rect x="30" y="44" width="160" height="34" rx="5" fill="#0f766e"/>
  <text x="110" y="66" text-anchor="middle" fill="#fff">递 chunk k 的一段</text>
  <rect x="190" y="44" width="135" height="34" rx="5" fill="#99d5ce" stroke="#0f766e" stroke-dasharray="4 3"/>
  <text x="257" y="60" text-anchor="middle" fill="#0f766e">① 思考时,帮手接着递</text>
  <text x="257" y="74" text-anchor="middle" class="mono" fill="#0f766e">chunk k 没用完的后半段</text>
  <rect x="325" y="44" width="46" height="34" rx="5" fill="#ecc489" stroke="#b45309" stroke-dasharray="4 3"/>
  <text x="348" y="60" text-anchor="middle" class="mono" fill="#b45309">前~13帧</text>
  <text x="348" y="74" text-anchor="middle" class="mono" fill="#b45309">不递</text>
  <rect x="371" y="44" width="144" height="34" rx="5" fill="#b45309"/>
  <text x="443" y="66" text-anchor="middle" fill="#fff">chunk k+1 从第~13 帧递起</text>
  <path d="M325 40 h46" stroke="#b45309"/>
  <path d="M325 40 h190" stroke="#b45309" fill="none"/>
  <text x="420" y="34" text-anchor="middle" class="mono" fill="#b45309">—— 这两段同属 chunk k+1 ——</text>
  <rect x="515" y="44" width="135" height="34" rx="5" fill="#ecc489" stroke="#b45309" stroke-dasharray="4 3"/>
  <text x="582" y="66" text-anchor="middle" fill="#b45309">① 帮手接着递</text>
  <path d="M348 92 v10" stroke="#b45309"/>
  <text x="348" y="118" text-anchor="middle" class="mut">③ 跳过的是 chunk k+1 自己的开头:照片是 ~0.5 秒前拍的,这几帧</text>
  <text x="348" y="134" text-anchor="middle" class="mut">描述的动作对应的时间已经过去了(思考时帮手已代为执行),从"现在"对应的帧接入(算法见第 4 节)</text>
  <text x="30" y="178" font-weight="600">② 开机时:</text>
  <text x="100" y="178">第一次思考特别慢(1–2 秒),这期间先递一个<tspan font-weight="600">"标准站立姿势"</tspan>撑着——</text>
  <text x="100" y="198">就算断供,僵在"站立"上是安全的。想完后用 1 秒钟从站立平滑过渡到第一份 chunk。</text>
</svg>