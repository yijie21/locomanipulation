<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="800" height="130"><style>
text{font-family:'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:12.5px;fill:#22262b}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11.5px}
.mut{fill:#6b7280}
.axis{stroke:#d8d5cc;stroke-width:1}
</style><rect x="0" y="0" width="800" height="130" fill="#ffffff"/>
  <rect x="8" y="24" width="230" height="76" rx="8" fill="#ffffff" stroke="#d8d5cc"/>
  <text x="123" y="48" text-anchor="middle" font-weight="600">大脑(VLA 模型)</text>
  <text x="123" y="68" text-anchor="middle" class="mut">看一张照片,思考 ~0.5 秒,</text>
  <text x="123" y="86" text-anchor="middle" class="mut">写出一份 1.6 秒的 action chunk</text>
  <rect x="285" y="24" width="230" height="76" rx="8" fill="#ffffff" stroke="#d8d5cc"/>
  <text x="400" y="48" text-anchor="middle" font-weight="600">传令员(客户端程序)</text>
  <text x="400" y="68" text-anchor="middle" class="mut">把 chunk 一帧一帧递给身体,</text>
  <text x="400" y="86" text-anchor="middle" class="mut">每秒递 25 帧</text>
  <rect x="562" y="24" width="230" height="76" rx="8" fill="#ffffff" stroke="#d8d5cc"/>
  <text x="677" y="48" text-anchor="middle" font-weight="600">身体(SONIC 控制器)</text>
  <text x="677" y="68" text-anchor="middle" class="mut">每 0.02 秒要一个目标姿势,</text>
  <text x="677" y="86" text-anchor="middle" class="mut">拼命把自己贴到目标上</text>
  <g stroke="#6b7280"><line x1="240" y1="62" x2="283" y2="62"/><line x1="517" y1="62" x2="560" y2="62"/></g>
</svg>