<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240"><style>
text{font-family:'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:12.5px;fill:#22262b}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11.5px}
.mut{fill:#6b7280}
.axis{stroke:#d8d5cc;stroke-width:1}
</style><rect x="0" y="0" width="820" height="240" fill="#ffffff"/>
  <text x="30" y="26" font-weight="600">大脑(独立线程,每 0.4 s 出一份新 chunk)</text>
  <g>
    <rect x="30" y="38" width="100" height="26" rx="4" fill="#ffffff" stroke="#9f1239"/>
    <text x="80" y="55" text-anchor="middle" class="mono" fill="#9f1239">思考→A</text>
    <rect x="180" y="38" width="100" height="26" rx="4" fill="#ffffff" stroke="#b45309"/>
    <text x="230" y="55" text-anchor="middle" class="mono" fill="#b45309">思考→B</text>
    <rect x="330" y="38" width="100" height="26" rx="4" fill="#ffffff" stroke="#0f766e"/>
    <text x="380" y="55" text-anchor="middle" class="mono" fill="#0f766e">思考→C</text>
    <rect x="480" y="38" width="100" height="26" rx="4" fill="#ffffff" stroke="#9f1239"/>
    <text x="530" y="55" text-anchor="middle" class="mono" fill="#9f1239">思考→D</text>
  </g>
  <g stroke="#6b7280" stroke-dasharray="2 3">
    <line x1="130" y1="66" x2="130" y2="106"/><line x1="280" y1="66" x2="280" y2="106"/>
    <line x1="430" y1="66" x2="430" y2="106"/><line x1="580" y1="66" x2="580" y2="106"/>
  </g>
  <text x="30" y="96" font-weight="600">传令员(独立线程,每 0.04 s 递一帧,永不停)</text>
  <g>
    <rect x="30" y="106" width="100" height="30" rx="4" fill="#6b7280"/>
    <text x="80" y="126" text-anchor="middle" fill="#fff" class="mono">旧chunk</text>
    <rect x="130" y="106" width="150" height="30" rx="4" fill="#9f1239"/>
    <text x="205" y="126" text-anchor="middle" fill="#fff" class="mono">递 A 第10,11…帧</text>
    <rect x="280" y="106" width="150" height="30" rx="4" fill="#b45309"/>
    <text x="355" y="126" text-anchor="middle" fill="#fff" class="mono">换 B 第10帧起</text>
    <rect x="430" y="106" width="150" height="30" rx="4" fill="#0f766e"/>
    <text x="505" y="126" text-anchor="middle" fill="#fff" class="mono">换 C 第10帧起</text>
    <rect x="580" y="106" width="150" height="30" rx="4" fill="#9f1239"/>
    <text x="655" y="126" text-anchor="middle" fill="#fff" class="mono">换 D…</text>
  </g>
  <path d="M130 146 v10" stroke="#22262b"/>
  <text x="134" y="170">每次换新 chunk 也不从第 1 帧递——同样按"照片拍下后过了多久"跳帧接入(第 4 节)</text>
  <text x="30" y="200" class="mut">身体永远有新鲜指令,blocking 要修的三个问题在这里天生不存在。</text>
  <text x="30" y="222" class="mut">代价:每份 40 帧的 chunk 只被执行了 ~10 帧就被更新的替换 —— 剩下 30 帧看似浪费(第 6 节变废为宝)。</text>
</svg>