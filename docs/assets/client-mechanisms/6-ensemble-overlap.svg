<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300"><style>
text{font-family:'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:12.5px;fill:#22262b}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11.5px}
.mut{fill:#6b7280}
.axis{stroke:#d8d5cc;stroke-width:1}
</style><rect x="0" y="0" width="820" height="300" fill="#ffffff"/>
  <line x1="80" y1="240" x2="780" y2="240" class="axis"/>
  <g class="mono mut">
    <text x="130" y="258">8.4</text><text x="230" y="258">8.8</text><text x="330" y="258">9.2</text>
    <text x="430" y="258">9.6</text><text x="530" y="258">10.0</text><text x="630" y="258">10.4</text>
    <text x="730" y="258">10.8 s</text>
  </g>
  <line x1="540" y1="34" x2="540" y2="240" stroke="#22262b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="548" y="46" font-weight="600">现在 = 10.0 s</text>
  <rect x="140" y="180" width="400" height="30" rx="4" fill="#c9ccd2" stroke="#6b7280"/>
  <text x="90" y="200" class="mono">Z</text>
  <text x="340" y="200" text-anchor="middle" class="mut">覆盖 8.4–10.0,刚好用完 → 不参与</text>
  <rect x="240" y="140" width="400" height="30" rx="4" fill="#e7a4b4" stroke="#9f1239"/>
  <text x="90" y="160" class="mono" fill="#9f1239">A</text>
  <text x="390" y="160" fill="#9f1239">1.2 秒前写的,它的第 30 帧 = "现在"</text>
  <rect x="340" y="100" width="400" height="30" rx="4" fill="#ecc489" stroke="#b45309"/>
  <text x="90" y="120" class="mono" fill="#b45309">B</text>
  <text x="475" y="120" fill="#b45309">0.8 秒前写的,第 20 帧 = "现在"</text>
  <rect x="440" y="60" width="400" height="30" rx="4" fill="#99d5ce" stroke="#0f766e"/>
  <text x="90" y="80" class="mono" fill="#0f766e">C</text>
  <text x="565" y="80" fill="#0f766e">0.4 秒前写的,第 10 帧 = "现在"</text>
  <circle cx="540" cy="75" r="5" fill="#0f766e"/>
  <circle cx="540" cy="115" r="5" fill="#b45309"/>
  <circle cx="540" cy="155" r="5" fill="#9f1239"/>
  <text x="98" y="288">递出去的动作 = <tspan class="mono">44%·C 的意见 + 33%·B 的意见 + 24%·A 的意见</tspan></text>
</svg>