<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 260" role="img"
     aria-label="双线路示意图:上方Worker线程车道显示几段推理工作块，每段结束后短暂空闲再开始下一次推理；每次推理结束时有一个向下的箭头指向主线程车道，代表把新chunk放进共享的latest字典。下方主线程车道是连续不间断的密集刻度，代表每33毫秒发送一帧动作，完全不因为worker是否在忙而停顿。">
  <defs>
    <style>
      text{ font-family: -apple-system, "Segoe UI", sans-serif; fill:#172420; }
      .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <pattern id="denseTicks" width="22" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#2F6F63" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.6" fill="#7C8880"/>
    </marker>
    <marker id="dot2" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.6" fill="#2F6F63"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="260" fill="#FBFCFB"/>

  <text x="60" y="44" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#7C8880">WORKER 线程 · 每次推理 0.3–0.6s，歇一下再来</text>
  <rect x="60" y="56" width="1060" height="34" rx="6" fill="#E3E8E3"/>
  <rect x="60" y="56" width="260" height="34" rx="6" fill="#C1571F"/>
  <text x="190" y="78" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#fff">推理中</text>
  <rect x="340" y="56" width="260" height="34" rx="6" fill="#C1571F"/>
  <text x="470" y="78" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#fff">推理中</text>
  <rect x="620" y="56" width="260" height="34" rx="6" fill="#C1571F"/>
  <text x="750" y="78" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#fff">推理中</text>
  <rect x="900" y="56" width="220" height="34" rx="6" fill="#C1571F" opacity="0.55"/>

  <!-- drop arrows into mailbox -->
  <g stroke="#7C8880" stroke-width="1.3" fill="none">
    <line x1="320" y1="90" x2="320" y2="128" marker-end="url(#dot)"/>
    <line x1="600" y1="90" x2="600" y2="128" marker-end="url(#dot)"/>
    <line x1="880" y1="90" x2="880" y2="128" marker-end="url(#dot)"/>
  </g>

  <!-- mailbox -->
  <rect x="470" y="112" width="260" height="34" rx="6" fill="#FBFCFB" stroke="#7C8880" stroke-dasharray="3,3"/>
  <text x="600" y="134" text-anchor="middle" class="mono" font-size="11" fill="#4E5B55">latest = {"chunk", "t0"}  (+ lock)</text>

  <g stroke="#2F6F63" stroke-width="1.3" fill="none">
    <line x1="600" y1="146" x2="600" y2="168" marker-end="url(#dot2)"/>
  </g>

  <text x="60" y="196" class="mono" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#194A40">主线程 · 30 Hz 连续发布，从不因 worker 而停</text>
  <rect x="60" y="182" width="1060" height="34" rx="6" fill="url(#denseTicks)" stroke="#2F6F63" stroke-opacity="0.4"/>

  <text x="60" y="248" font-size="11" fill="#4E5B55">worker 忙的时候，主线程一直在重放信箱里那份"最新的"chunk——只是索引不停地 +1，直到信箱换了新的</text>
</svg>
