[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
; the room level (src/locomani/sim/unreal/build_level.py --room); a scene's level is opened by the render that needs it
EditorStartupMap=/Game/Levels/Warehouse

[/Script/Engine.RendererSettings]
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; virtual shadow maps off: fragile with several scene captures (GPU hang 2026-09-28)
r.Shadow.Virtual.Enable=0

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[DevOptions.Shaders]
; the editor runs under taskset on 4 cores (scripts/unreal/editor_guard.sh); UE sizes the worker pool from that affinity
PercentageUnusedShaderCompilingThreads=25
NumUnusedShaderCompilingThreads=1

[ConsoleVariables]
; fresh camera requests render this many captures (world frozen) so Lumen GI and TSR accumulate
urlab.FreshCaptureRepeats=8
; MuJoCo and our Isaac renderer clip at 2 cm; URLab's 1 mm shows robot geometry at the lens
urlab.CameraNearClipCm=2.0
; no Nanite in shadows: the Nanite cube pass costs ~0.37 ms per face per shadowed light (13 ms per capture in the
; warehouse) however little moves; every mesh is non-Nanite too (src/locomani/sim/unreal/in_editor/no_nanite.py)
r.Shadow.Nanite=0
; ShowFlag.Rendering=0 (editor viewport off) cannot live here: ShowFlag.* are ECVF_Cheat, refused from project inis.
; src/locomani/sim/unreal/in_editor/cmd_server.py sets it when the editor starts.
