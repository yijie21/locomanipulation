[/Script/UnrealEd.EditorPerformanceSettings]
; headless editor is never "foreground"; throttling drops it to ~9 fps and every bridge game-thread task waits a frame
bThrottleCPUWhenNotForeground=False
bMonitorEditorPerformance=False

; no crash reports or usage data to Epic. The engine default (BaseEditorSettings.ini) is True, and the editor runs
; -unattended, so CrashReportClient uploaded a report unasked on the 2026-09-28 crash. With this False and
; -unattended, UnixPlatformCrashContext skips CrashReportClient entirely (bSkipCRC); the crash still logs locally.
[/Script/UnrealEd.CrashReportsPrivacySettings]
bSendUnattendedBugReports=False

[/Script/UnrealEd.AnalyticsPrivacySettings]
bSendUsageData=False
